<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo Chat — AKSynxa WhatsApp Base</title>
<style>
  * { box-sizing: border-box; margin: 0; font-family: "Segoe UI", Arial, sans-serif; }
  body { background: #e8edf5; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 22px 12px; }
  h1 { font-size: 17px; color: #0b1f4a; margin-bottom: 4px; }
  p.sub { font-size: 13px; color: #64748b; margin-bottom: 16px; text-align: center; }
  .phone { width: 380px; max-width: 96vw; height: 640px; max-height: 82vh; background: #0b141a; border-radius: 34px; padding: 10px; box-shadow: 0 18px 50px rgba(11,31,74,.35); }
  .screen { background: #efeae2; height: 100%; border-radius: 26px; display: flex; flex-direction: column; overflow: hidden; }
  .chat-header { background: #075e54; color: #fff; padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, #2563eb, #7c3aed); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex: none; }
  .chat-header .nm { font-size: 15px; font-weight: 600; }
  .chat-header .st { font-size: 12px; opacity: .85; }
  #chat { flex: 1; overflow-y: auto; padding: 14px 10px; display: flex; flex-direction: column; gap: 8px; }
  .bubble { max-width: 82%; padding: 8px 11px; border-radius: 10px; font-size: 14px; line-height: 1.45; white-space: pre-wrap; box-shadow: 0 1px 1px rgba(0,0,0,.12); }
  .in { background: #fff; align-self: flex-start; border-top-left-radius: 2px; }
  .out { background: #d9fdd3; align-self: flex-end; border-top-right-radius: 2px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 10px 0; }
  .chip { background: #fff; border: 1px solid #25d366; color: #075e54; border-radius: 999px; padding: 5px 12px; font-size: 12.5px; cursor: pointer; }
  .inputbar { display: flex; gap: 8px; padding: 10px; }
  .inputbar input { flex: 1; border: none; border-radius: 999px; padding: 11px 15px; font-size: 14px; outline: none; }
  .inputbar button { width: 44px; height: 44px; border: none; border-radius: 50%; background: #25d366; color: #fff; font-size: 17px; cursor: pointer; flex: none; }
  a.back { margin-top: 14px; font-size: 13px; color: #2563eb; text-decoration: none; }
</style>
</head>
<body>
<h1>💬 Live Demo — WhatsApp Bot</h1>
<p class="sub">Browser me hi bot ko test karein. Koi WhatsApp number nahi chahiye.<br>Har chat Google Sheet / local log me record hoti hai.</p>
<div style="margin-bottom:14px;font-size:14px;color:#0b1f4a">Brand:
  <select id="brandSel" onchange="switchBrand()" style="border:1px solid #cbd5e1;border-radius:8px;padding:7px 10px;font-size:14px;background:#fff"></select>
</div>

<div class="phone">
  <div class="screen">
    <div class="chat-header">
      <div class="avatar">AK</div>
      <div>
        <div class="nm" id="brandName">Bot</div>
        <div class="st">online · AKSynxa automation</div>
      </div>
    </div>
    <div id="chat"></div>
    <div class="chips">
      <button class="chip" onclick="quick('hi')">👋 Hi</button>
      <button class="chip" onclick="quick('2')">💰 Prices</button>
      <button class="chip" onclick="quick('3')">📅 Booking</button>
      <button class="chip" onclick="quick('menu')">📋 Menu</button>
    </div>
    <div class="inputbar">
      <input id="msg" placeholder="Message likhein…" autocomplete="off">
      <button onclick="send()">➤</button>
    </div>
  </div>
</div>
<a class="back" href="/admin">⚙️ Settings badalne ke liye Admin page →</a>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('msg');
const USER_ID = 'demo-web-user';
let BRAND = new URLSearchParams(location.search).get('brand') || '';

function bubble(text, cls) {
  const d = document.createElement('div');
  d.className = 'bubble ' + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

async function sendText(text) {
  if (!text.trim()) return;
  bubble(text, 'out');
  const res = await fetch('/simulate', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({from: USER_ID, text, brand: BRAND}) });
  const out = await res.json();
  (out.replies || []).forEach(r => bubble(r, 'in'));
  if (out.paused) bubble('(Bot pause hai — owner ko alert bhej diya gaya hai. Nayi chat ke liye page refresh karein.)', 'in');
}

function send() { const t = input.value; input.value = ''; sendText(t); }
function quick(t) { sendText(t); }
input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

async function loadBrandName() {
  const d = await (await fetch('/brand?brand=' + encodeURIComponent(BRAND))).json();
  document.getElementById('brandName').textContent = d.name;
  BRAND = d.slug;
}
async function switchBrand() {
  BRAND = document.getElementById('brandSel').value;
  chat.innerHTML = '';
  await loadBrandName();
  sendText('hi');
}
(async () => {
  const d = await (await fetch('/brands')).json();
  if (!BRAND) BRAND = d.default;
  document.getElementById('brandSel').innerHTML = d.brands.map(b =>
    `<option value="${b.slug}" ${b.slug === BRAND ? 'selected' : ''}>${b.name}</option>`).join('');
  await loadBrandName();
  sendText('hi');
})();
</script>
</body>
</html>
